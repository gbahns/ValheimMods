# Hexium (valheim.hexium.gg) publish config: same package, Hexium repository URL and category slugs.
# Used by package.ps1 -Hexium.  Keep versionNumber/description in step with thunderstore.toml.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "TheGreatestShips"
versionNumber = "0.9.3"
description = "Eight ships on Valheim's own hulls: a Fast Karve and Fast Longship, three cargo tiers (Knarr, Busse, Big Busse) and three Byrdings with a fenced, gated pen for livestock. Speeds from logged sailing; recipes, health and hull size server-synced."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/TheGreatestShips"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"
"ValheimModding-Jotunn" = "2.30.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/TheGreatestShips.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://valheim.hexium.gg"
communities = ["valheim"]

[publish.categories]
valheim = ["Pieces", "Open Source", "Valheim 1.0"]
