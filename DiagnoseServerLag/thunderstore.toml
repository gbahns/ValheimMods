[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "DiagnoseServerLag"
versionNumber = "0.9.3"
description = "Names the cause of lag instead of guessing. Measures your client and the server once a second and tells you which it is: starved server, saturated link, packet loss, object churn, world loading, or your own machine."
websiteUrl = "https://github.com/gbahns/ValheimMods"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/DiagnoseServerLag.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "server-side", "client-side", "utility", "ai-generated"]
