[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "Armory"
versionNumber = "1.0.0"
description = "Craft an Armory Rack to save, store and instantly recall named gear sets - armor, weapons, cape, utility and hotbar - without rummaging through chests every time you switch tasks."
websiteUrl = "https://thunderstore.io/c/valheim/p/DeathMonger/Armory/"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"
"ValheimModding-Jotunn" = "2.30.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/Armory.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "building", "utility", "ai-generated"]
