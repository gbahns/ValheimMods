# Hexium (valheim.hexium.gg) publish config: same package, Hexium repository URL and category slugs.
# Used by package.ps1 -Hexium.  Keep versionNumber/description in step with thunderstore.toml.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "Armory"
versionNumber = "1.3.0"
description = "Craft an Armory Rack to save, store and instantly recall named gear sets - armor, weapons, cape, utility and hotbar - without rummaging through chests every time you switch tasks."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/Armory"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"
"ValheimModding-Jotunn" = "2.30.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/Armory.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://valheim.hexium.gg"
communities = ["valheim"]

[publish.categories]
valheim = ["Pieces", "Equipment", "Storage", "Quality of Life", "Open Source", "Valheim 1.0"]
