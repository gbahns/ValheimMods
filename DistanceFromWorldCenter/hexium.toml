# Hexium (valheim.hexium.gg) publish config: same package, Hexium repository URL and category slugs.
# Used by package.ps1 -Hexium.  Keep versionNumber/description in step with thunderstore.toml.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "DistanceFromWorldCenter"
versionNumber = "1.0.1"
description = "Always-on HUD widget showing your horizontal distance from the world center (0,0), with optional X/Z coordinates."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/DistanceFromWorldCenter"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"
"ValheimModding-Jotunn" = "2.30.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net462/DistanceFromWorldCenter.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://valheim.hexium.gg"
communities = ["valheim"]

[publish.categories]
valheim = ["User Interface", "Quality of Life", "Open Source", "Valheim 1.0"]
