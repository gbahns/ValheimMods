# Hexium (valheim.hexium.gg) publish config: same package, Hexium repository URL and category slugs.
# Used by package.ps1 -Hexium.  Keep versionNumber/description in step with thunderstore.toml.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "WhatsMyWorkbenchMissing"
versionNumber = "0.1.0"
description = "Hover a crafting station's level number to see which upgrades you haven't built yet but could, with their materials."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/WhatsMyWorkbenchMissing"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/WhatsMyWorkbenchMissing.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://valheim.hexium.gg"
communities = ["valheim"]

[publish.categories]
valheim = ["Quality of Life", "Crafting", "Open Source", "Valheim 1.0"]
