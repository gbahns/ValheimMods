[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "One_Click_Launch"
versionNumber = "1.0.0"
description = "One click from the main menu back into the game you were playing. Remembers each character with the world or server they were actually played in."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/OneClickLaunch"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/OneClickLaunch.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods"]
