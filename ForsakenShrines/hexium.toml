# Hexium (valheim.hexium.gg) publish config: same package, Hexium repository URL and category slugs.
# Used by package.ps1 -Hexium.  Keep versionNumber/description in step with thunderstore.toml.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "ForsakenShrines"
versionNumber = "0.8.2"
description = "Build shrines to the Forsaken bosses. Each shrine remotely channels its boss's guardian power once you mount the boss's trophy on it, to switch forsaken powers without having to return to the sacrificial stones at the world center."
websiteUrl = "https://thunderstore.io/c/valheim/p/DeathMonger/ForsakenShrines/"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"
"ValheimModding-Jotunn" = "2.30.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/ForsakenShrines.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://valheim.hexium.gg"
communities = ["valheim"]

[publish.categories]
valheim = ["Pieces", "Progression", "Mechanics", "Open Source", "Valheim 1.0"]
