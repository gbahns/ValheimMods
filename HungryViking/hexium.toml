# Hexium (valheim.hexium.gg) publish config: same package, Hexium repository URL and category slugs.
# Used by package.ps1 -Hexium.  Keep versionNumber/description in step with thunderstore.toml.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "Hungry_Viking"
versionNumber = "1.2.0"
description = "Visual warnings for hunger, smoke, and poison — screen vignettes and on-screen labels that escalate in urgency so you never miss a critical status."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/HungryViking"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net462/HungryViking.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://valheim.hexium.gg"
communities = ["valheim"]

[publish.categories]
valheim = ["User Interface", "Quality of Life", "Open Source", "Valheim 1.0"]
