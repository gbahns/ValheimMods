[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "TheGreatestMap"
versionNumber = "0.3.0"
description = "ALPHA. Shared markers that stay erased, a table that only carries exploration, and a pocket map that records only what you actually found."
websiteUrl = "https://github.com/gbahns/ValheimMods"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/TheGreatestMap.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "server-side", "client-side", "utility", "ai-generated"]
