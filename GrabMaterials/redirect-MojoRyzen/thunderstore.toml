[config]
schemaVersion = "0.0.1"

[package]
namespace = "MojoRyzen"
name = "GrabMaterials"
versionNumber = "2.0.0"
description = "MOVED to DeathMonger/GrabMaterials - install that listing instead."
websiteUrl = "https://thunderstore.io/c/valheim/p/DeathMonger/GrabMaterials/"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"
"ValheimModding-Jotunn" = "2.30.0"

[build]
icon = "../icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "../bin/Release/net462/GrabMaterials.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods"]
