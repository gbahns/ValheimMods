[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "Comfortometer"
versionNumber = "0.1.2"
description = "A compact HUD panel that stays up while you move: every piece giving you comfort, its distance, duplicates in range, and what you just walked out of range of, in red."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/Comfortometer"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/Comfortometer.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods"]
