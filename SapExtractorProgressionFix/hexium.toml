# Hexium (valheim.hexium.gg) publish config: same package, Hexium repository URL and category slugs.
# Used by package.ps1 -Hexium.  Keep versionNumber/description in step with thunderstore.toml.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "SapExtractorProgressionFix"
versionNumber = "0.1.0"
description = "Sap extractors now fill up for the whole time you were away, instead of losing it when you walk back in."
websiteUrl = "https://github.com/gbahns/ValheimMods/tree/main/SapExtractorProgressionFix"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/SapExtractorProgressionFix.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://valheim.hexium.gg"
communities = ["valheim"]

[publish.categories]
valheim = ["Quality of Life", "Bug Fixes", "Open Source", "Valheim 1.0"]
