[config]
schemaVersion = "0.0.1"

[package]
namespace = "DeathMonger"
name = "DudeWhatAreMyStats"
versionNumber = "0.2.0"
description = "Your stats on one key press, with the game paused while you read. Scoreboard of every player, including ones who are offline: kills, deaths, K/D, bosses, time played and best skill."
websiteUrl = "https://github.com/gbahns/ValheimMods"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/Release/net48/DudeWhatAreMyStats.dll"
target = "BepInEx/plugins/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "client-side", "server-side", "utility", "ai-generated"]
